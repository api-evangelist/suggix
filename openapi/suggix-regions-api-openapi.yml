openapi: 3.2.0
info:
  title: StatOrigin Regions API
  version: 1.0.0
  summary: Free, open industry statistics with complete primary-source provenance.
  description: 'Every response carries the full provenance of each data point: the publishing

    organisation, report title, publication date, page or table locator, the verbatim

    sentence the value was extracted from, and a working link to the original document.'
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    name: StatOrigin
    url: https://statorigin.org
servers:
- url: https://statorigin.org/api/v1
tags:
- name: Regions
  description: Countries and supranational groupings
paths:
  /regions:
    get:
      tags:
      - Regions
      summary: List regions
      operationId: listRegions
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - world
          - country
          - bloc
          - subnational
      responses:
        '200':
          description: Region list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
  /regions/{slug}/export.xlsx:
    get:
      tags:
      - Regions
      summary: Download region data as Excel
      description: Provenance-rich Excel for one geography. Accepts the readable slug (`china`) or the stable code (`CN`).
      operationId: exportRegionXlsx
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: china
      responses:
        '200':
          description: Excel download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Workbook limit exceeded; use CSV
  /regions/{slug}/export.csv:
    get:
      tags:
      - Regions
      summary: Download region data as CSV
      description: Provenance-rich CSV for one geography. Accepts the readable slug (`china`) or the stable code (`CN`).
      operationId: exportRegionCsv
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: china
      responses:
        '200':
          description: CSV download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            docs:
              type: string
              format: uri
    Meta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        next_cursor:
          type:
          - string
          - 'null'
        attribution:
          type: string
        license:
          type: string
          format: uri
        docs:
          type: string
          format: uri
