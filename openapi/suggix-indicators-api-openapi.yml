openapi: 3.2.0
info:
  title: StatOrigin Indicators API
  version: 1.0.0
  summary: Free, open industry statistics with complete primary-source provenance.
  description: 'Every response carries the full provenance of each data point: the publishing

    organisation, report title, publication date, page or table locator, the verbatim

    sentence the value was extracted from, and a working link to the original document.'
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    name: StatOrigin
    url: https://statorigin.org
servers:
- url: https://statorigin.org/api/v1
tags:
- name: Indicators
  description: Indicator definitions and time series
paths:
  /indicators:
    get:
      tags:
      - Indicators
      summary: List indicators
      operationId: listIndicators
      parameters:
      - name: industry
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
        description: Substring match on name and definition
      responses:
        '200':
          description: Indicator list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
  /indicators/{slug}:
    get:
      tags:
      - Indicators
      summary: Get one indicator
      operationId: getIndicator
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Indicator detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /indicators/{slug}/series:
    get:
      tags:
      - Indicators
      summary: Time series for an indicator
      description: One entry per observation, each carrying its own source. A time series here is a set of individually sourced points, not one dataset with one citation.
      operationId: getIndicatorSeries
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: region
        in: query
        schema:
          type: string
        description: Region code or slug. Defaults to GLOBAL.
      - name: from
        in: query
        schema:
          type: integer
        example: 2015
      - name: to
        in: query
        schema:
          type: integer
        example: 2026
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /indicators/{slug}/export.xlsx:
    get:
      tags:
      - Indicators
      summary: Download indicator data as Excel
      description: Provenance-rich Excel for one measure across all regions and periods.
      operationId: exportIndicatorXlsx
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Excel download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Workbook limit exceeded; use CSV
  /indicators/{slug}/export.csv:
    get:
      tags:
      - Indicators
      summary: Download indicator data as CSV
      description: Provenance-rich CSV for one measure across all regions and periods.
      operationId: exportIndicatorCsv
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: CSV download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            docs:
              type: string
              format: uri
    Meta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        next_cursor:
          type:
          - string
          - 'null'
        attribution:
          type: string
        license:
          type: string
          format: uri
        docs:
          type: string
          format: uri
